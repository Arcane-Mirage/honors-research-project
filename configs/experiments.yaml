# Experiments override parts of configs/default.yaml (llm, system_prompt, processing, evaluation).
# Run one with:  csr-lab experiment <name>
#
# `strategies:` defines extra strategies as variants of existing ones.
# They are registered at start-up, so they can be used in any experiment or
# with `csr-lab analyze --strategy <name>` without code changes.
#
# `sweeps:` (bottom) runs one experiment over a grid of settings:  csr-lab sweep <name>
#
# LLM choice: `llm:` names a profile from configs/llms.yaml (or gives settings). An
# experiment without `llm:` uses the default profile. `--llm NAME` on the command line
# replaces the experiment's choice, e.g.  csr-lab experiment main --llm lmstudio
#
# Who the documents are read for (system prompt, `evaluation.customer`) comes from the
# dataset's manifest (`reader`); an experiment's `system_prompt:` / `evaluation:` override it.

experiments:
  # --- The four conditions --------------------------------------------------------------
  demo_mock:
    description: Offline demonstration of the four conditions with the mock model.
    dataset: data/synthetic/text/manifest.json
    split: all
    strategies: [single_pass, staged, staged_verified, graph_assisted]
    repetitions: 3
    base_seed: 1000
    llm: {provider: mock}

  main:
    description: The four conditions with the selected LLM profile (--llm NAME, or the default).
    split: all
    strategies: [single_pass, staged, staged_verified, graph_assisted]
    repetitions: 3

  local_lmstudio:
    description: >-
      Local model through LM Studio's server (OpenAI-compatible, port 1234). The loaded model is
      detected (`model: auto` in the lmstudio profile) and recorded with every result;
      `csr-lab llms models lmstudio` shows it with its quantisation.
    split: all
    strategies: [single_pass, staged, staged_verified, graph_assisted]
    repetitions: 1
    llm: lmstudio

  api_model:
    description: Commercial OpenAI-compatible API. Set the model ID before running.
    split: all
    strategies: [single_pass, staged, staged_verified, graph_assisted]
    repetitions: 3
    llm: openai                     # set model: and pricing: in the openai profile (configs/llms.yaml)

  azure_openai_example:
    description: >-
      Azure OpenAI deployment with Microsoft Entra ID (keyless) authentication. Fill in the
      resource and deployment, `pip install azure-identity`, sign in (`az login`), then check the
      connection with `csr-lab llm-check --experiment azure_openai_example`.
    split: all
    strategies: [llm_chunked_merge_llm, staged_verified, staged_verified_merge_hybrid, graph_assisted]
    repetitions: 3
    llm: azure                      # fill in the azure profile in configs/llms.yaml

  # --- Ablations and transfer experiments (offline) -------------------------------------
  ablation_mock:
    description: Graph-assisted ablations. Isolates alias resolution, graph rules, delta-document links and verification.
    split: all
    strategies: [staged_verified, graph_assisted, graph_assisted_no_alias, graph_assisted_no_rules, graph_assisted_no_structure, graph_assisted_no_verification]
    repetitions: 3
    llm: {provider: mock}

  candidate_selection_mock:
    description: Forces topic-based candidate selection (no all-pairs) to measure graph-derived candidate recall.
    split: all
    strategies: [staged_verified_topic_candidates, graph_assisted_topic_candidates]
    repetitions: 3
    llm: {provider: mock}

  practice_vs_pipeline_mock:
    description: >-
      Industry-style pipeline (model chunks, per-chunk references, model-merged reference names)
      against the staged pipeline with verification and guarded merging. The headline comparison.
    split: all
    strategies: [llm_chunked_merge_llm, llm_chunked, llm_chunked_repaired, staged_verified, staged_verified_merge_hybrid, graph_assisted]
    repetitions: 3
    llm: {provider: mock}
    evaluation: {baseline_strategy: llm_chunked_merge_llm}

  chunking_mock:
    description: >-
      Model-made chunks against whole chapters: per-chunk extraction with and without source
      repair, with the chapter-based `staged` condition as the control.
    split: all
    strategies: [llm_chunked, llm_chunked_repaired, staged]
    repetitions: 3
    llm: {provider: mock}
    evaluation: {baseline_strategy: llm_chunked}

  merging_mock:
    description: Reference merging methods (deterministic, model-only, hybrid with guard rules) on top of Condition C, with D for reference.
    split: all
    strategies: [staged_verified, staged_verified_merge_llm, staged_verified_merge_hybrid, graph_assisted]
    repetitions: 3
    llm: {provider: mock}
    evaluation: {baseline_strategy: staged_verified}

  customer_scoping_mock:
    description: Hiding paragraphs labelled only for other customers from the model (filter) against tagging them (tag).
    split: all
    strategies: [staged, staged_scope_filter, graph_assisted, graph_assisted_scope_filter]
    repetitions: 3
    llm: {provider: mock}
    evaluation: {baseline_strategy: staged}

  saved_graph:
    description: >-
      Does a saved graph help? The base agreement is built into a graph first (build-graph on
      graph_input/, with the same model); then the delta standard alone is analysed with and
      without that graph and graded. Offline: --llm mock --repetitions 3.
    dataset: data/synthetic/incremental/manifest.json
    split: all
    saved_graph: {build_from: data/synthetic/incremental/graph_input}
    strategies: [graph_assisted, graph_assisted_no_saved]
    evaluation: {baseline_strategy: graph_assisted_no_saved}

  # --- Input form: PDF rendering and PDF extraction artifacts ---------------------------
  pdf_mock:
    description: The four conditions on the PDF rendering (running headers, page footers, page breaks inside requirements).
    dataset: data/synthetic/pdf/manifest.json
    split: all
    strategies: [single_pass, staged, staged_verified, graph_assisted]
    repetitions: 3
    llm: {provider: mock}

  noisy_mock:
    description: The four conditions with PDF extraction artifacts in the text ('s upplier', 'require-\nments').
    dataset: data/synthetic/noisy/manifest.json
    split: all
    strategies: [single_pass, staged, staged_verified, graph_assisted]
    repetitions: 3
    llm: {provider: mock}

  # --- Graph context given to the conflict model ----------------------------------------
  graph_context_mock:
    description: >-
      Formats of the graph context given to the conflict model (graph_assisted). The mock model
      ignores graph context, so this only checks the machinery: all rows should score the
      same and differ in input size. Use graph_context_local for evidence.
    split: all
    strategies: [graph_assisted, graph_assisted_ctx_triples, graph_assisted_ctx_json, graph_assisted_ctx_ids, staged_verified]
    repetitions: 1
    llm: {provider: mock}
    evaluation: {baseline_strategy: graph_assisted_ctx_ids}

  graph_context_local:
    description: >-
      Graph context formats with a real (local) model. graph_assisted_ctx_ids is the original
      rendering; staged_verified (no graph) shows how much graph context helps at all.
    split: all
    strategies: [graph_assisted, graph_assisted_ctx_triples, graph_assisted_ctx_json, graph_assisted_ctx_ids, staged_verified]
    repetitions: 3
    evaluation: {baseline_strategy: graph_assisted_ctx_ids}
    llm: lmstudio                   # a profile from configs/llms.yaml; `--llm NAME` picks another

strategies:
  # --- real-document features (each one off, to isolate it) ---
  staged_scope_filter:
    base: staged
    description: Condition B, hiding paragraphs labelled only for other customers from the model.
    options: {customer_scoping: filter}

  graph_assisted_scope_filter:
    base: graph_assisted
    description: Condition D, hiding paragraphs labelled only for other customers from the model.
    options: {customer_scoping: filter}

  graph_assisted_no_structure:
    base: graph_assisted
    description: Condition D without delta-document chapter links (no inherits_from/amends edges, no aligned-chapter candidates).
    options: {structure_links: off}

  # --- graph context format (graph.context_format; graph_assisted uses "sentences") ---
  graph_assisted_ctx_triples:
    base: graph_assisted
    description: graph_assisted with graph context as 'subject | relation | object' lines.
    options: {graph: {context_format: triples}}

  graph_assisted_ctx_json:
    base: graph_assisted
    description: graph_assisted with graph context as JSON objects.
    options: {graph: {context_format: json}}

  graph_assisted_ctx_ids:
    base: graph_assisted
    description: graph_assisted with the original graph context (raw requirement IDs and relation codes).
    options: {graph: {context_format: ids}}

  # --- reference merging (configs: reference_merging) ---
  staged_verified_merge_llm:
    base: staged_verified
    description: Condition C plus one model call that groups all reference labels (model-only merging).
    options: {reference_merging: {method: llm}}

  staged_verified_merge_hybrid:
    base: staged_verified
    description: Condition C plus rule-selected alias questions to the model, with revision/identifier guard rules.
    options: {reference_merging: {method: hybrid}}

  llm_chunked_merge_llm:
    base: llm_chunked
    description: "Industry-style pipeline end to end: model chunks, per-chunk references, model-only reference merging."
    options: {reference_merging: {method: llm}}

  # --- ablations ---
  graph_assisted_no_saved:
    base: graph_assisted
    description: Condition D without a saved graph (each case analysed alone); the control arm of saved_graph experiments.
    options: {graph: {use_saved: false}}

  graph_assisted_no_alias:
    base: graph_assisted
    description: Condition D without graph alias resolution (isolates name-to-identifier resolution).
    options: {graph: {alias_resolution: false}}

  graph_assisted_no_rules:
    base: graph_assisted
    description: Condition D without deterministic exclusion/precedence flagging.
    options: {graph: {applicability_rules: false, precedence_rules: false}}

  graph_assisted_no_verification:
    base: graph_assisted
    description: Graph-informed processing without the verification stage.
    options:
      verification: {enabled: false}
      conflicts: {validate_evidence: false}

  staged_verified_single_attempt:
    base: staged_verified
    description: Condition C with one targeted re-extraction round instead of two.
    options: {verification: {max_attempts: 1}}

  staged_verified_topic_candidates:
    base: staged_verified
    description: Condition C with topic-overlap candidate selection instead of all pairs.
    options: {conflicts: {all_pairs_max: 0}}

  graph_assisted_topic_candidates:
    base: graph_assisted
    description: Condition D with topic-overlap plus graph-derived candidate selection instead of all pairs.
    options: {conflicts: {all_pairs_max: 0}}

sweeps:
  # --- real-document features ------------------------------------------------------------
  registry:
    experiment: demo_mock
    description: >-
      What documents.yaml adds: names of documents known only by name resolve to identifiers
      (deterministically, in every strategy), titles let structure statements be resolved.
    grid:
      processing.document_registry: [false, true]
    metrics: [references.f1, references.errors.unresolved_alias, references.input_resolution_rate, graph.chapter_link_f1, conflicts.precedence_accuracy, graph.node_resolution_rate]

  customer_scoping:
    experiment: demo_mock
    description: >-
      Customer-labelled paragraphs: off / tag (find blocks, tag references) / filter (hide other
      customers' blocks from the model). Tokens of extract_references show what filtering saves.
    strategies: [staged, graph_assisted]
    grid:
      options.customer_scoping: ["off", tag, filter]   # quoted: YAML reads a bare off as false
    metrics: [references.precision, references.recall, references.errors.other_customer, references.other_customer_mentions, ops.stage_tokens.extract_references, ops.estimated_tokens]

  pdf_noise:
    experiment: demo_mock
    description: >-
      PDF extraction artifacts ('s upplier', 'require-\nments') with and without the
      artifact-insensitive quote matching, on the clean and the noisy texts.
    grid:
      dataset: [data/synthetic/text/manifest.json, data/synthetic/noisy/manifest.json]
      processing.grounding_artifact_match: [false, true]
    metrics: [references.f1, references.artifact_evidence, conflicts.evidence_validity_rate, conflicts.f1, requirements.verbatim_exact_rate, graph.chapter_link_f1]

  structure:
    experiment: demo_mock
    description: >-
      Delta-document links and precedence classification: chapter links off/registry/detect,
      precedence labels on/off (graph_assisted).
    strategies: [graph_assisted]
    grid:
      options.structure_links: ["off", detect]
      options.conflicts.precedence_classification: [false, true]
    metrics: [graph.chapter_link_f1, conflicts.precedence_accuracy, conflicts.resolved_by_precedence, conflicts.f1, conflicts.candidate_pair_recall]

  graph_context:
    experiment: graph_context_local
    description: >-
      Graph context format x amount of context, with a real model. Conflict metrics are the
      outcome; analyze_conflicts tokens show what each format costs.
    strategies: [graph_assisted]
    grid:
      options.graph.context_format: [sentences, triples, json, ids]
      options.graph.max_context_items: [3, 6, 12]
    metrics: [conflicts.f1, conflicts.precision, conflicts.recall, conflicts.hard_negative_false_positives, conflicts.cross_document_recall, conflicts.ambiguous_recall, conflicts.evidence_validity_rate, ops.stage_tokens.analyze_conflicts]

  chunk_size:
    experiment: chunking_mock
    description: How the model chunk size changes per-chunk extraction, with chapters as the control.
    strategies: [llm_chunked, staged]
    grid:
      options.chunking.target_chunk_words: [60, 150, 500]
    metrics: [references.f1, units.f1, units.mean_gold_per_unit, requirements.verbatim_exact_rate, ops.tokens_per_gold_requirement]

  merge_errors:
    experiment: merging_mock
    description: >-
      How merging methods react to a model that drops revisions or merges look-alike
      identifiers (the mock's merge error rates).
    strategies: [staged_verified, staged_verified_merge_llm, staged_verified_merge_hybrid]
    grid:
      llm.mock.merge_revision_drop_rate: [0.0, 1.0]
      llm.mock.merge_confusion_rate: [0.0, 1.0]
    metrics: [references.f1, references.errors.revision, references.errors.wrong_requirement, references.errors.unresolved_alias, references.errors.spurious, references.merges_applied, references.merges_rejected]

  pdf_preprocessing:
    experiment: pdf_mock
    description: PDF reader and header/footer removal on the PDF rendering.
    strategies: [staged_verified]
    grid:
      processing.pdf_backend: [pypdf, pypdf_layout, pymupdf]   # pymupdf: pip install pymupdf (AGPL)
      processing.pdf_strip_repeated_lines: [false, true]
    metrics: [requirements.recall, requirements.verbatim_exact_rate, requirements.location_accuracy, references.precision, references.f1, references.errors.spurious]

  text_vs_pdf:
    experiment: pdf_mock
    description: The same case as text, as PDF (with header/footer removal) and with PDF extraction artifacts.
    strategies: [staged, staged_verified, graph_assisted]
    grid:
      dataset: [data/synthetic/text/manifest.json, data/synthetic/pdf/manifest.json, data/synthetic/noisy/manifest.json]
      processing.pdf_strip_repeated_lines: [true]
    metrics: [requirements.recall, requirements.verbatim_exact_rate, references.f1, conflicts.f1]

  saved_graph_pairs:
    experiment: saved_graph
    description: >-
      How many pairs the saved-graph conflict check sends to the model, and how much topic
      overlap a linked pair needs. The graph is built once and shared by every setting.
    strategies: [graph_assisted]
    grid:
      options.graph.saved_min_score: [0.0, 0.08, 0.2]
      options.graph.saved_max_pairs: [20, 200]
    metrics: [conflicts.recall, conflicts.precision, conflicts.f1, conflicts.saved_graph_predicted, conflicts.saved_graph_hits, conflicts.candidate_pair_recall, ops.stage_tokens.check_saved_conflicts]
