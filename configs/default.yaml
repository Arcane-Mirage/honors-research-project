# Default configuration. Experiments in experiments.yaml override parts of it.
# Per-strategy settings (verification, conflicts, graph use) are defined by the
# strategy presets in src/csr_lab/pipelines/strategies.py and by variants in
# experiments.yaml, not here.
#
# Which LLM to talk to is chosen in configs/llms.yaml (`--llm NAME` on any command).
# The `llm:` block below holds the base settings every profile starts from.

llm:
  provider: mock              # mock | openai_compatible
  model: mock-heuristic-v1
  base_url: null              # e.g. https://api.openai.com/v1 or http://localhost:1234/v1
  api_key_env: OPENAI_API_KEY # name of the environment variable that holds the key
  auth:                       # how credentials are sent (see llm/auth.py)
    method: env               # env | command | azure_identity | none
    header: Authorization     # Azure OpenAI key auth: api-key
    scheme: Bearer            # Azure OpenAI key auth: null
  chat_path: /chat/completions
  query_params: {}            # e.g. {api-version: "2024-10-21"} for Azure deployment URLs
  temperature: 0.0
  max_output_tokens: 4096
  max_tokens_parameter: max_tokens   # some newer OpenAI models need max_completion_tokens
  timeout_seconds: 120
  max_transport_retries: 2    # network / 429 / 5xx retries
  retry_backoff_seconds: 2    # doubled after each failed attempt
  max_validation_retries: 2   # extra attempts when the model returns invalid JSON
  seed: 1234                  # replaced per repetition by the experiment runner
  send_seed: true
  structured_output: json_schema   # json_schema | json_object | prompt
  fallback_to_prompt_mode: true    # if the server rejects response_format, retry in prompt mode
  max_concurrency: 1
  pricing:                    # leave null unless you have reliable prices
    input_usd_per_million_tokens: null
    output_usd_per_million_tokens: null
  mock:                       # error injection for the offline mock model
    reference_miss_rate: 0.15
    hallucination_rate: 0.08
    quote_paraphrase_rate: 0.10
    conflict_miss_rate: 0.20
    conflict_false_positive_rate: 0.05
    invalid_json_rate: 0.0     # >0 exercises the retry path
    merge_confusion_rate: 0.3  # model-only merging: look-alike identifiers merged
    merge_revision_drop_rate: 0.5  # model-only merging: revision variants merged without revision
    merge_alias_miss_rate: 0.2 # a document name not linked to its identifier
    quote_cleanup_rate: 0.8    # quotes repaired like a real model's ('s upplier' -> 'supplier')
    seed: 0

# Extra system-prompt text: who the documents are read for (edit the wording in
# src/csr_lab/prompts/system_prompt.py). Used by `analyze` and `build-graph`; experiments
# switch it off (the synthetic cases have other customers). `--no-system-prompt` compares.
system_prompt:
  enabled: true
  supplier: Bendix
  customer: Navistar
  customer_aliases: [International, International Motors, International Motors LLC, International Motors Inc., Navistar International Corporation, Navistar Inc.]
  ambiguous_aliases: [International]   # also an ordinary word
  other_customers: skip                # skip | keep text that applies only to other customers
  # Other customers that share the standards, with their other names. Customer scoping
  # (strategy option customer_scoping: off | tag | filter) recognises a label line such as
  # "MAN: ..." or "Scania/Navistar: ..." only when every name before the colon is listed here
  # or is the customer above. Names match from the start of a part, word by word.
  other_customers_names:
    MAN: [MAN Truck & Bus, MAN Truck & Bus SE]
    Scania: [Scania CV AB]
    VWTB: [VW T&B, VW Truck & Bus, Volkswagen Truck & Bus]
    TRATON: [TRATON Group, TRATON SE, RIO]
    Audi: [AUDI AG, AUDI HUNGARIA]
    Porsche: [Dr. Ing. h.c. F. Porsche AG]
    ŠKODA AUTO: [SKODA AUTO, Skoda]
    Bentley: [Bentley Motors]
    SEAT: []
    Volkswagen: [VW, Volkswagen AG, Volkswagen Passenger Cars, VW Passenger Cars, VW PKW, VW Commercial Vehicles, VW Components]

processing:
  max_document_chars: 200000
  chunk_max_chars: 24000
  chunk_overlap_segments: 1
  include_source_text: true
  pdf_min_chars_per_page: 20
  pdf_backend: pypdf                 # pypdf | pypdf_layout | pymupdf (optional, AGPL)
  pdf_strip_repeated_lines: true     # remove running headers / page footers (sweeps compare false/true)
  pdf_repeated_line_min_share: 0.5   # share of pages a header/footer line must appear on
  document_registry: true            # read documents.yaml next to the files (identifiers, titles, aliases)
  grounding_artifact_match: true     # quotes differing only by spaces/dashes ('s upplier') still count as found

evaluation:
  requirement_match_threshold: 0.75
  baseline_strategy: single_pass

# The saved graph `csr-lab build-graph` builds up (override with --graph PATH).
graph_store:
  path: graphs/main.json
  use: true          # graph-assisted strategies start from the saved graph (--no-use-graph to turn off)
  update: true       # merge each run into the saved graph (--no-update-graph: read-only)
  write_views: true  # also write <graph>.overview.mmd, .detail.mmd (people) and .llm.md (LLMs)
  prune_superseded_conflicts: true   # after an update, drop conflicts with requirements of superseded revisions

input: null          # folder `csr-lab build-graph` reads when none is given; null: the synthetic demo PDFs
input_formats: [.pdf]  # the data pool: other files are skipped (they still become nodes when referenced)

output_dir: outputs
database_path: outputs/experiments.sqlite
