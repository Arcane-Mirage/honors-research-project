[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csr-relationship-lab"
version = "0.1.0"
description = "Research framework for document-reference extraction, JSON relationship graphs, and potential conflict detection in customer-specific requirement (CSR) documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "pydantic>=2.11,<3",
    "PyYAML>=6.0",
    "httpx>=0.27,<1",
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pip-tools>=7.5",
]
# Optional, not in the lockfile: Microsoft Entra ID auth for Azure OpenAI (llm.auth.method: azure_identity)
azure = ["azure-identity>=1.15"]
# Optional, not in the lockfile: PyMuPDF reader (processing.pdf_backend: pymupdf). AGPL-licensed.
pymupdf = ["pymupdf>=1.24"]

[project.scripts]
csr-lab = "csr_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Emitted by langsmith (a LangGraph dependency) on Python 3.14; not ours.
    "ignore::DeprecationWarning:langsmith.*",
]
